<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: "Kanit", sans-serif;
            scroll-behavior: smooth;
            background-image: url("public/assets/images/Desktop - 1.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>

<body class="bg-black text-white">
    <div id="nav"></div>

    <section class="pt-32 max-w-6xl mx-auto px-6">
            <div class="grid md:grid-cols-[1fr_1fr_1fr] gap-8 items-center">

                    @iam_kaminaxv

                <div class="flex items-center pt-5">
                    <img src="public\assets\images\qr-tiktok.jpg" class="h-20" />
